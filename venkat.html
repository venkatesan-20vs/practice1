<h1>Venkat</h1>
</center>
<hr>

<p>
  An Indian actor known predominantly for Telugu-language films, best recognized for his debut lead role in Sri Sita Ramula Kalyanam Chootamu Raarandi (1998) and appearances in films like Annayya (2000), Siva Rama Raju (2002), and recent projects like They Call Him OG (2025).
